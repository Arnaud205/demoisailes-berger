/* ==========================================
   LES DEMOIS'AILES DU BERGER - PREMIUM MOBILE
   ========================================== */

:root {
  --honey: #d9a642;
  --honey-dark: #9d6d1d;
  --wood: #5d4027;
  --forest: #dfeecf;
  --cream: #f8f2ea;
  --white: #ffffff;
  --text: #2d2a27;
  --muted: #675d53;
  --shadow: rgba(33, 22, 12, 0.12);
  --radius: 18px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: #fffdfb;
  color: var(--text);
  line-height: 1.6;
}

img {
  max-width: 100%;
  display: block;
}

a {
  text-decoration: none;
}

button, input, textarea {
  font: inherit;
}

.container {
  width: min(1120px, calc(100% - 24px));
  margin: 0 auto;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(93, 64, 39, 0.08);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 66px;
  gap: 16px;
}

.brand {
  font-weight: 700;
  color: var(--wood);
  font-size: 1.05rem;
}

.menu {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.menu a {
  color: var(--wood);
  font-size: 0.85rem;
  font-weight: 600;
  opacity: 0.9;
}

.hero {
  background: linear-gradient(135deg, #7f5a35 0%, #d9a642 25%, #f3d79a 100%);
  color: white;
  padding: 42px 0 28px;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  align-items: center;
}

.tag {
  display: inline-block;
  margin-bottom: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.hero-copy h1 {
  font-size: clamp(2.2rem, 6vw, 4.2rem);
  line-height: 1.08;
  margin-bottom: 14px;
  font-weight: 800;
}

.hero-copy p {
  color: rgba(255,255,255,0.9);
  font-size: 1rem;
  max-width: 560px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 22px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 0.9rem 1.3rem;
  font-weight: 700;
  transition: all 0.2s ease;
}

.btn.primary {
  background: var(--wood);
  color: white;
  box-shadow: 0 8px 18px rgba(93, 64, 39, 0.25);
}

.btn.secondary {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
}

.hero-visual img {
  width: 100%;
  border-radius: 22px;
  box-shadow: 0 20px 30px rgba(54, 34, 18, 0.18);
  border: 4px solid rgba(255,255,255,0.2);
}

.features {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  margin-top: -18px;
  margin-bottom: 28px;
}

.feature-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 22px 18px;
  box-shadow: 0 12px 28px var(--shadow);
  text-align: center;
  border: 1px solid rgba(93,64,39,0.05);
}

.feature-card span {
  font-size: 2rem;
}

.feature-card h3 {
  margin: 10px 0 8px;
  color: var(--wood);
  font-size: 1.1rem;
}

.feature-card p {
  color: var(--muted);
  font-size: 0.95rem;
}

.section {
  padding: 52px 0;
}

.section-light {
  background: #fffaf5;
}

.section-wood {
  background: linear-gradient(180deg, #f6efe7 0%, #efe0ce 100%);
}

.section-green {
  background: #edf7eb;
}

.section-heading {
  margin-bottom: 24px;
}

.eyebrow {
  color: var(--honey-dark);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  font-size: 0.75rem;
  margin-bottom: 6px;
}

.section-heading h2,
.content-block h2,
.contact-box h2 {
  color: var(--wood);
  font-size: clamp(1.9rem, 4vw, 3rem);
  line-height: 1.2;
  margin-bottom: 10px;
}

.grid-products {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}

.product-card {
  background: var(--white);
  overflow: hidden;
  border-radius: var(--radius);
  box-shadow: 0 12px 24px var(--shadow);
}

.product-card img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  background: #f5eee7;
}

.product-info {
  padding: 16px 16px 18px;
}

.product-info h3 {
  font-size: 1.2rem;
  color: var(--wood);
  margin-bottom: 8px;
}

.product-info p {
  color: var(--muted);
  font-size: 0.92rem;
  margin-bottom: 12px;
}

.product-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.price {
  font-weight: 800;
  color: var(--honey-dark);
  font-size: 1.2rem;
}

.product-footer button,
.contact-form button {
  background: var(--wood);
  color: white;
  border: none;
  border-radius: 999px;
  padding: 0.7rem 1rem;
  font-weight: 700;
  cursor: pointer;
}

.small-grid {
  grid-template-columns: 1fr 1fr;
}

.mini-card {
  background: rgba(255,255,255,0.7);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: 0 10px 18px rgba(93, 64, 39, 0.08);
  text-align: center;
}

.mini-card img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 10px;
}

.mini-card h3 {
  color: var(--wood);
  font-size: 1rem;
}

.mini-card p {
  color: var(--honey-dark);
  font-weight: 700;
}

.split {
  display: grid;
  grid-template-columns: 1fr;
  gap: 22px;
  align-items: center;
}

.content-block p {
  color: var(--muted);
  margin-bottom: 18px;
}

.image-block img {
  width: 100%;
  border-radius: var(--radius);
  box-shadow: 0 16px 24px rgba(93, 64, 39, 0.13);
}

.gallery-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}

.gallery-grid img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-radius: var(--radius);
  box-shadow: 0 10px 20px var(--shadow);
}

.contact-section {
  background: #f7efe6;
}

.contact-box {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 14px 28px rgba(93,64,39,0.1);
  padding: 20px;
}

.contact-box p {
  color: var(--muted);
}

.contact-form {
  display: grid;
  gap: 10px;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  border: 1px solid rgba(93,64,39,0.15);
  border-radius: 12px;
  padding: 0.9rem 1rem;
  background: #fff;
}

.footer {
  background: #2b241e;
  color: rgba(255,255,255,0.88);
  padding: 18px 0;
}

.footer-inner {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
  text-align: center;
  font-size: 0.9rem;
}

@media (min-width: 620px) {
  .features {
    grid-template-columns: repeat(3, 1fr);
  }

  .grid-products {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .gallery-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .contact-box {
    grid-template-columns: 1.1fr 1fr;
    padding: 28px;
  }
}

@media (min-width: 900px) {
  .hero {
    padding: 62px 0 36px;
  }

  .hero-grid {
    grid-template-columns: 1.1fr 1fr;
    gap: 44px;
  }

  .grid-products {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .split {
    grid-template-columns: 1fr 1.1fr;
  }

  .gallery-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .footer-inner {
    flex-direction: row;
    align-items: center;
    text-align: left;
  }
}
